<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las Doce Coronas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans+SC:wght@500;700;800&display=swap">
<style>
/* Las Doce Coronas · v2 "Arte y vida".
   Layout: en pantallas angostas el escenario (canvas 480×300 escalado) va arriba y debajo el panel HTML
   (diálogo, ventanas del grupo, menú, pad). Con escenario ≥ 720 px el panel se superpone al canvas como en
   las referencias: diálogo arriba, ventanas abajo a la derecha, menú de comandos a la derecha. */
:root{
  --ink:#0a0c12; --text:#eef2fa; --muted:#a9b3c8; --gold:#d8b25a; --gold-hi:#ffd77a; --lacre:#9e2f37; --lacre-hi:#c4434c;
  --win-a:rgba(26,40,72,.93); --win-b:rgba(10,16,32,.93); --win-line:#c9d6ee; --win-in:#1c2a4a; --sel:rgba(96,138,210,.55);
  --hp:#5fcf86; --pm:#6ea6ff; --imp:#f0c04a;
  --f-display:"Marcellus SC", "Trajan Pro", Georgia, serif;
  --f-body:"Alegreya", Georgia, "Times New Roman", serif;
  --f-ui:"Alegreya Sans SC", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#151a28 0%,var(--ink) 70%);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;min-height:0}
header.topbar{width:min(100%,var(--stageW,100%));margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
.brand{font-family:var(--f-display);letter-spacing:.06em;font-size:15px;color:#efe4c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand span{font-family:var(--f-ui);color:var(--muted);letter-spacing:.08em;font-size:13px;margin-left:8px}
.tools{display:flex;gap:6px;flex:0 0 auto}
.iconbtn{font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;background:var(--win-b);color:#cfd9ee;border:1px solid #4b5c80;border-radius:6px;padding:6px 12px;min-height:44px;cursor:pointer}
.iconbtn:focus-visible,.mi:focus-visible,.padbtn:focus-visible,#dialog:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
#stage{position:relative;flex:0 0 auto;border-radius:6px;box-shadow:0 0 0 1px #2a3248,0 12px 34px rgba(0,0,0,.6);background:#000;overflow:hidden}
[hidden]{display:none!important}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.bub{position:absolute;left:0;top:0;max-width:190px;width:max-content;background:#fbf7ee;color:#2a2230;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.02em;line-height:1.2;padding:4px 9px 5px;border:2px solid #3b3046;border-radius:9px;box-shadow:0 2px 0 rgba(0,0,0,.35);animation:bubIn .16s ease-out both}
.bub::after{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#3b3046;border-bottom:0}
.bub::before{content:"";position:absolute;left:var(--tail,50%);bottom:-4px;margin-left:-4px;border:4px solid transparent;border-top-color:#fbf7ee;border-bottom:0;z-index:1}
.bub.e{background:#f7e4df;border-color:#6a2228}.bub.e::after{border-top-color:#6a2228}.bub.e::before{border-top-color:#f7e4df}
.bub.amb{font-weight:500;background:rgba(251,247,238,.95)}
.bub.out{animation:bubOut .2s ease-in both}
@keyframes bubIn{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}
@keyframes bubOut{to{opacity:0;margin-top:-6px}}
#cutin{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:6}
#cutin .band{position:absolute;left:-10%;right:-10%;top:24%;height:52%;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(14,18,34,.94) 18%,rgba(14,18,34,.94) 82%,rgba(0,0,0,0));border-block:2px solid rgba(255,215,122,.75);transform:skewY(-4deg);display:flex;align-items:center;gap:18px;padding:0 16%;animation:cut 1.5s ease both}
#cutin .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,215,122,.10) 0 2px,transparent 2px 28px);animation:streak .5s linear infinite}
#cutin canvas{position:relative;width:min(34vh,38%,200px);aspect-ratio:1;height:auto;image-rendering:pixelated;border-radius:4px;box-shadow:0 0 0 2px var(--gold-hi),0 0 26px rgba(255,200,90,.55)}
#cutin .ct{position:relative;font-family:var(--f-display);color:#fff4d8;font-size:clamp(18px,4.2vw,40px);letter-spacing:.05em;text-shadow:0 2px 0 #3a2410,0 0 18px rgba(255,190,80,.6)}
#cutin .ct small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--gold-hi);letter-spacing:.16em}
@keyframes cut{0%{transform:translateX(60%) skewY(-4deg);opacity:0}14%{transform:translateX(0) skewY(-4deg);opacity:1}84%{transform:translateX(-2%) skewY(-4deg);opacity:1}100%{transform:translateX(-60%) skewY(-4deg);opacity:0}}
@keyframes streak{to{background-position:56px 0}}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--f-ui);font-size:14px;letter-spacing:.05em;background:rgba(10,16,32,.92);color:#f4ecd6;border:1px solid var(--gold);border-radius:999px;padding:6px 14px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:7}
#toast.on{opacity:1}
body.wide #toast{top:auto;bottom:30%}

/* ---------- panel (debajo en angosto, superpuesto en ancho) ---------- */
#panel{width:var(--stageW,100%);flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.win{background:linear-gradient(180deg,var(--win-a),var(--win-b));border:2px solid var(--win-line);border-radius:6px;box-shadow:inset 0 0 0 2px var(--win-in),inset 0 0 0 3px rgba(201,214,238,.22),0 6px 18px rgba(0,0,0,.45)}

/* diálogo: retrato enmarcado a la izquierda, placa con el nombre, máquina de escribir */
#dialog{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:12px 14px 12px 12px;cursor:pointer;position:relative;min-height:112px;flex:0 0 auto}
#pframe{width:96px;height:96px;position:relative;border:2px solid var(--gold);border-radius:3px;background:#0c1222;box-shadow:0 0 0 2px #2a1d0a,inset 0 0 0 1px rgba(255,215,122,.3)}
#pframe::after{content:"";position:absolute;inset:-6px;border:1px solid rgba(216,178,90,.35);border-radius:5px;pointer-events:none}
#pcv{width:100%;height:100%;display:block;image-rendering:pixelated}
#pframe.pxp #pcv{image-rendering:auto}#pframe.pxp.pxhi #pcv{image-rendering:pixelated} /* v26: busto pixel art de 128 px (LDC_DLGPX): suave al achicar, duro al agrandar */
#dname{display:inline-block;font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.1em;color:#20160a;background:linear-gradient(180deg,#f3d58a,#c99b45);border:1px solid #6d4c18;border-radius:3px;padding:1px 10px 2px;margin:-2px 0 6px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#dline{--dfs:17px;font-size:var(--dfs);color:var(--text);min-height:2.9em;max-width:66ch;text-shadow:0 1px 0 rgba(0,0,0,.6)}
#dialog.narr{grid-template-columns:1fr;min-height:84px}#dialog.noport{grid-template-columns:1fr}#dialog.noport #pframe{display:none}
#dialog.narr #pframe,#dialog.narr #dname{display:none}
#dialog.narr #dline{font-style:italic;color:#d9dfec}
#dialog.noport{grid-template-columns:1fr}
#dialog.noport #pframe{display:none}
#dnext{position:absolute;right:12px;bottom:6px;color:var(--gold-hi);font-size:14px;animation:bob .9s ease-in-out infinite;pointer-events:none}
#dnext.wait{opacity:0}
/* puesta de la caja de diálogo (escenas dinámicas) */
#dline .h{visibility:hidden}
#dline .kn{color:#ffe1a0}
#dline .kp{color:#9fd3ff}
#dline .kw{color:#ffd77a;text-decoration:underline;text-decoration-color:rgba(255,215,122,.45);text-underline-offset:3px}
#dline .shw{white-space:nowrap}
#dline .sh{display:inline-block;animation:dsh .16s steps(2) infinite;font-weight:700;color:#fff3e0;text-transform:uppercase} /* v26-fix: grito en mayúsculas (Brian) */
@keyframes dsh{0%{transform:translate(0,0)}50%{transform:translate(.6px,-.8px)}100%{transform:translate(-.6px,.6px)}}
#dialog.pin #pframe{animation:pin .26s cubic-bezier(.2,.9,.3,1.2)}
#dialog.right.pin #pframe{animation-name:pinr}
@keyframes pin{0%{transform:translateX(-26px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pinr{0%{transform:translateX(26px);opacity:0}100%{transform:none;opacity:1}}
#dialog.pbump #pframe{animation:pbump .22s ease-out}
@keyframes pbump{0%{transform:scale(1)}40%{transform:scale(1.07) translateY(-2px)}100%{transform:scale(1)}}
#dialog.pin #dname{animation:nin .3s ease-out}
@keyframes nin{0%{transform:translateY(-4px);opacity:0}100%{transform:none;opacity:1}}
#dialog.right,body.wide #dialog.right{grid-template-columns:1fr auto}
body.wide #dialog.low{top:auto;bottom:3%}
body.wide #dialog.side,body.wide #dialog.narr.side{left:2.4%;right:36%;text-align:left}
#dialog.right #pframe{order:2}
/* #dialog.right #pcv: sin espejar (el espejado cambiaba de lado los ojos de Ilian, que tiene heterocromía) */
#dialog.right #dnext{right:auto;left:14px}
#dialog.think #dline{font-style:italic;color:#bcd2f2}
#dialog.think #pcv{filter:saturate(.45) brightness(.82)}
#dialog.think{background:linear-gradient(180deg,rgba(20,28,52,.97),rgba(12,16,32,.97))}
#dialog.whisper #dline{font-style:italic;font-size:calc(var(--dfs) * .94);color:#c9cfdd;letter-spacing:.02em}
#dnext{text-shadow:0 0 6px rgba(255,215,122,.6)}
/* botones en una franja propia (en el flujo de la grilla): ningún texto queda debajo */
#dbtns{grid-column:1 / -1;justify-self:end;display:flex;gap:6px;margin:2px 22px -4px 0}
#dialog.right #dbtns{order:3;justify-self:start;margin:2px 0 -4px 22px}
#dbtns:empty,#dbtns:not(:has(button:not([hidden]))){display:none}
#dbtns button{min-height:32px;padding:0 10px;font:700 14px/1 var(--f-ui);letter-spacing:.04em;color:#e2e9f8;background:rgba(20,28,48,.92);border:1px solid #6a7ca4;border-radius:6px;cursor:pointer}
#dbtns button b{font-size:17px;margin-right:2px}
#dbtns kbd{font:600 11px/1 var(--f-ui);margin-left:6px;padding:2px 4px;border:1px solid #6a7ca4;border-radius:3px;color:#aab6d0}
#dbtns button:hover,#dbtns button:focus-visible{background:#2a3858;border-color:var(--gold)}
#dfast.on{background:var(--lacre);border-color:var(--lacre-hi);color:#fff}
#dskip.arm{background:#6a4a10;border-color:var(--gold-hi);color:#fff}
@media (max-width:560px){#dbtns kbd{display:none}#dbtns button{min-height:30px;padding:0 8px;font-size:13px}}
@media (prefers-reduced-motion:reduce){#dline .sh{animation:none}#dialog.pin #pframe,#dialog.pbump #pframe,#dialog.pin #dname{animation:none}}
@keyframes bob{50%{transform:translateY(3px)}}

/* ventanas del grupo (PV/PM/Ímpetu) */
#hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex:0 0 auto}
.pc{padding:5px 7px 6px;font-family:var(--f-ui);font-size:12px;color:var(--text);display:grid;gap:2px;border-width:1px;box-shadow:inset 0 0 0 1px var(--win-in),0 3px 10px rgba(0,0,0,.35);transition:box-shadow .15s,border-color .15s}
.pc.act{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi),0 0 14px rgba(255,215,122,.45)}
.pc.ko{filter:grayscale(.85);opacity:.62}
.pc-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px;min-width:0}
.pc-h b{font-size:14px;font-weight:700;letter-spacing:.04em;white-space:nowrap;flex:0 0 auto}
.pc-h span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pc-r{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.pc-r em{font-style:normal;font-weight:700;font-size:12px;letter-spacing:.06em}
.pc-r em.hp{color:var(--hp)} .pc-r em.mp{color:var(--pm)}
.pc-r strong{font-size:15px;font-weight:700;line-height:1}
.pc-r strong.low{color:#ffb15a} .pc-r strong.crit{color:#ff6b5a}
.bar{height:5px;background:#070b16;border:1px solid #33456a;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .25s}
.bar.hp i{background:linear-gradient(90deg,#2f9a5a,#8fe8a8)} .bar.hp.low i{background:linear-gradient(90deg,#c2701e,#ffc36a)} .bar.hp.crit i{background:linear-gradient(90deg,#a8262a,#ff7a62)}
.bar.mp i{background:linear-gradient(90deg,#2f5fc0,#8ab8ff)}
.impb{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:1px}
.impb i{height:6px;background:#1c160a;border:1px solid #6a5420;border-radius:1px;overflow:hidden;display:block}
.impb i b{display:block;height:100%;background:linear-gradient(90deg,#c08a1c,#ffe08a);transition:width .25s}
.impb i.full{box-shadow:0 0 6px rgba(255,215,122,.8)}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:0}
.chips span{font-size:12px;line-height:1.2;padding:0 5px;border-radius:3px;background:#24345a;color:#dfe8fb;border:1px solid #4a6292}
.chips span.bad{background:#4a1c22;border-color:#8a3a44;color:#ffd6d6}
.chips span.good{background:#1d3e2c;border-color:#3e7e58;color:#d6ffe4}

/* menú de comandos: lista vertical con ícono, nombre, costo a la derecha y línea de ayuda */
#menuBox{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
#menuTitle{font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;color:#b9c6e2;text-transform:uppercase;padding-left:2px}
#menu{display:flex;flex-direction:column;gap:2px;padding:5px}
#menu.two{display:grid;grid-template-columns:1fr 1fr}
#menu.two .mi{grid-template-columns:24px minmax(0,1fr);font-size:14px;padding:5px 8px;column-gap:7px}
#menu.two .mi .ml{white-space:normal;line-height:1.15}
#menu.two .mi .mc{grid-column:2;font-size:12px;color:var(--muted)}
#menu.two .mi .mc:empty{display:none}
.mi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;column-gap:9px;row-gap:1px;min-height:44px;padding:6px 10px;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--text);font-family:var(--f-ui);font-size:15px;letter-spacing:.03em;text-align:left;cursor:pointer;position:relative}
.mi .ml{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .mc{color:#cfd9ee;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.mi small{grid-column:2 / 4;font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:0;line-height:1.25;white-space:normal}
.mi:hover:not([disabled]),.mi:focus-visible,.mi.sel{background:linear-gradient(90deg,var(--sel),rgba(96,138,210,.12));border-color:rgba(201,214,238,.75)}
.mi.sel::before,.mi:focus-visible::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-5px;border:5px solid transparent;border-left-color:var(--gold-hi)}
.mi.primary .ml{color:#fff}
.mi.imp .ml{color:var(--gold-hi)}
.mi.back .ml{color:var(--muted)}
.mi[disabled]{opacity:.42;cursor:default}
.ic{width:24px;height:24px;display:block;background-size:24px 24px;background-repeat:no-repeat;image-rendering:pixelated}
.ic.ic-png{width:28px;height:28px;margin:-2px}
#mhelp{font-family:var(--f-body);font-size:14px;color:#e3e9f6;padding:6px 10px;min-height:2.3em;line-height:1.3;border-width:1px}
/* ---------- pad táctil: palanca circular de 8 direcciones (izq.) + botones redondos A/B/Menú (der.), bronce y oro ---------- */
#pad{--stk:140px;--knob:60px;--ba:80px;--bb:60px;--bm:48px;--cw:208px;--ph:168px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:0 0 auto;width:100%;
  padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;animation:padIn .2s ease-out both;transition:opacity .2s}
@keyframes padIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#pad.zurdo{flex-direction:row-reverse}
.pad-zone{position:relative;flex:1 1 0;min-width:calc(var(--stk) + 12px);max-width:300px;height:var(--ph);touch-action:none;cursor:grab}
.pad-zone:active{cursor:grabbing}
.pad-stick{position:absolute;left:8px;bottom:6px;width:var(--stk);height:var(--stk);border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.42) 0 27%,rgba(201,163,90,.28) 27.6% 28.6%,transparent 29.5%),radial-gradient(circle at 50% 38%,#3d2a19,#1d130b 62%,#0c0704);
  border:2px solid var(--au);box-shadow:0 0 0 3px rgba(18,12,8,.92),0 0 0 4px rgba(201,163,90,.38),inset 0 0 0 7px rgba(0,0,0,.35),inset 0 0 0 8px rgba(201,163,90,.22),0 10px 22px rgba(0,0,0,.55);transition:opacity .2s}
#pad.zurdo .pad-stick{left:auto;right:8px}
.pad-glow{position:absolute;inset:9px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .12s;
  background:conic-gradient(from calc(var(--ang,0deg) - 22.5deg),rgba(255,215,122,.5) 0 45deg,transparent 45deg 360deg);
  -webkit-mask:radial-gradient(circle,transparent 0 40%,#000 41%);mask:radial-gradient(circle,transparent 0 40%,#000 41%)}
.pad-stick.dir .pad-glow{opacity:1}
.pad-ar{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;padding:0;border:0;background:none;color:var(--au);opacity:.8;pointer-events:none;display:grid;place-items:center;transition:color .1s,opacity .1s,filter .1s}
.pad-ar svg{width:16px;height:16px;display:block}
.pad-ar[data-k="up"]{left:50%;top:19px}.pad-ar[data-k="down"]{left:50%;top:calc(100% - 19px)}.pad-ar[data-k="left"]{left:19px;top:50%}.pad-ar[data-k="right"]{left:calc(100% - 19px);top:50%}
.pad-ar[data-k="down"] svg{transform:rotate(180deg)}.pad-ar[data-k="left"] svg{transform:rotate(-90deg)}.pad-ar[data-k="right"] svg{transform:rotate(90deg)}
.pad-ar.on{color:var(--au-hi);opacity:1;filter:drop-shadow(0 0 5px rgba(255,215,122,.95))}
.pad-knob{position:absolute;left:50%;top:50%;width:var(--knob);height:var(--knob);margin:calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,transparent 0 30%,rgba(74,50,20,.55) 31% 33%,transparent 34% 47%,rgba(74,50,20,.45) 48% 50%,transparent 51%),radial-gradient(circle at 38% 30%,#fff3cc 0,#f2d58e 16%,#c9a35a 46%,#7a5a2a 80%,#4a3214);
  box-shadow:inset 0 -4px 7px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.35),0 5px 12px rgba(0,0,0,.65);transform:translate(var(--kx,0px),var(--ky,0px));transition:transform .16s cubic-bezier(.3,1.5,.5,1),box-shadow .12s}
.pad-stick.act .pad-knob{transition:box-shadow .12s;box-shadow:inset 0 -4px 7px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.35),0 0 0 3px rgba(255,215,122,.35),0 0 18px rgba(255,215,122,.55)}
#pad.float .pad-stick:not(.act){opacity:.55}
#pad.float .pad-zone::after{content:'';position:absolute;inset:4px;border:1px dashed rgba(201,163,90,.22);border-radius:14px;pointer-events:none}
.pad-btns{position:relative;flex:0 0 var(--cw);width:var(--cw);height:var(--ph)}
.pad-round{position:absolute;border-radius:50%;display:grid;place-items:center;align-content:center;padding:0;cursor:pointer;touch-action:manipulation;color:#fbeed0;border:2px solid var(--au);

.pz-tk{font-size:13px;color:var(--au-hi);border:1px solid #6a4e28;background:#1e140c;padding:0 6px}
.pz-sp{flex:1}
.pz-gold{display:flex;align-items:center;gap:6px;font-size:14px;color:#e8d6ae;padding:4px 12px;border:1px solid #6a4e28;border-radius:999px;background:#1a110a}

.pz-roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:8px;border:1px solid rgba(201,163,90,.45);border-radius:4px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 6px),rgba(16,10,6,.6)}

.pz-lv{position:absolute;left:4px;bottom:22px;display:grid;line-height:1;text-align:left}.pz-lv small{font-size:12px;color:#c8b48a}.pz-lv b{font-size:17px;color:#fff;text-shadow:0 1px 0 #000}

.pz-likes{font-family:var(--f-body);font-size:14px;margin:2px 0}.pz-quote{font-family:var(--f-body);font-style:italic;font-size:14px;color:#6a3a22;margin:4px 0 0}

.pz-det{padding:8px 10px;border:1px solid rgba(201,163,90,.3);border-radius:4px;background:rgba(10,7,4,.6)}.pz-det b{font-size:16px;color:var(--au-hi)}.pz-det p{font-family:var(--f-body);font-size:14px;margin:4px 0}.pz-det small{color:#c8b48a;font-size:12px}

.pz-glist{display:grid;gap:4px}

.gp-aff{overflow:visible;text-overflow:clip}.gp-aff b{display:inline-block;white-space:nowrap} /* v27 · RB2: el nivel de afinidad («Compañeros») baja entero al renglón siguiente en vez de cortarse con «…» */
.gp-heart{flex:0 0 auto;width:12px;height:11px;background:#d9566a;clip-path:path('M6 11 L1 6 C-1 3 1 0 3.5 0 C5 0 6 1.4 6 1.4 C6 1.4 7 0 8.5 0 C11 0 13 3 11 6 Z')}
.gp-ft .pz-rowb{min-height:36px;padding:0 8px;font-size:12px;white-space:nowrap}
.gp-side .pz-form{flex:0 0 auto}
.gp-sum{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gp-sum>div{display:grid;gap:1px;padding:6px 10px;border:1px solid rgba(201,163,90,.3);border-radius:4px;background:rgba(20,14,9,.7)}
.gp-sum small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--au)}.gp-sum b{font-size:14px;color:#f1e6cf;font-weight:600}
.gp-sum>div:first-child{grid-column:1/-1}
/* ---------- Objetos ---------- */
.iv-ic{--px:32px;--rc:rgba(201,163,90,.55);position:relative;flex:0 0 auto;width:calc(var(--px) + 8px);height:calc(var(--px) + 8px);display:grid;place-items:center;border:1px solid var(--rc);border-radius:4px;background:radial-gradient(circle at 50% 35%,#3a2a1a,#140d07 75%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.iv-ic .ic{width:var(--px);height:var(--px);background-size:var(--px) var(--px)}
.iv-ic .iv-icc{image-rendering:pixelated;display:block}
.iv-ic[data-r="importante"]{--rc:#f0cf6a;background:radial-gradient(circle at 50% 35%,#2c3c5c,#121a2c 75%)}.iv-ic[data-r="secreto"]{--rc:#c9a6f0;background:radial-gradient(circle at 50% 35%,#3e2a58,#1a1028 75%)}
.iv-ic.none{color:#8f8068;font-size:14px}.iv-ic.empty{opacity:.55}
/* íconos PNG (PixelLab): botín con ícono y tira de cofres/recompensas */
.vict-loot span.wi{display:inline-flex;align-items:center;gap:6px;padding-left:3px}.vict-loot span.wi .iv-ic{width:calc(var(--px) + 4px);height:calc(var(--px) + 4px)}
.loot-pop{position:absolute;left:50%;top:54px;transform:translate(-50%,-6px);display:flex;gap:6px;padding:6px 8px;background:rgba(10,16,32,.9);border:1px solid var(--gold);border-radius:8px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;z-index:60}
.loot-pop.on{opacity:1;transform:translate(-50%,0)}body.wide .loot-pop{top:auto;bottom:calc(30% + 44px)}
body.wide .pz-body.t-objetos{grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);grid-template-rows:auto minmax(0,1fr)}
.iv-top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid rgba(201,163,90,.35)}
.iv-filters{display:flex;flex-wrap:wrap;gap:4px}
.pzb.iv-f{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;font-size:14px;border-color:#5a4024;background:#1e140c;border-radius:19px}
.pzb.iv-f small{font-size:11px;min-width:18px;padding:1px 5px;border-radius:8px;background:#3a2818;color:#e6d7a8;font-variant-numeric:tabular-nums}
.pzb.iv-f.on{background:linear-gradient(180deg,#7a5420,#3a2410);border-color:var(--au-hi);color:#fff3d0}.pzb.iv-f.on small{background:#1a1006;color:var(--au-hi)}
.pzb.iv-f.empty{color:#9a8a6a}
.pzb.iv-f:hover{border-color:var(--au)}
.iv-sort{display:flex;align-items:center;gap:3px}.iv-sort>small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--au);margin-right:4px}
.pzb.iv-s{min-height:34px;padding:0 10px;font-size:13px;border-color:#5a4024;background:#160f09}.pzb.iv-s.on{border-color:var(--au-hi);color:var(--au-hi);background:#2a1c10}
.iv-list{display:grid;gap:4px;align-content:start}
.pzb.iv-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:4px 12px 4px 4px;border-color:rgba(201,163,90,.3);background:rgba(20,14,9,.72)}
.pzb.iv-row:hover{border-color:var(--au)}
.pzb.iv-row.on{border-color:var(--au-hi);background:linear-gradient(90deg,rgba(120,84,32,.6),rgba(20,14,9,.72));box-shadow:inset 3px 0 0 var(--au-hi)}
.iv-rt{display:grid;min-width:0}.iv-rt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.iv-rt small{font-size:12px;color:#c8b48a;letter-spacing:.03em}
.iv-row.worn .pz-cnt{color:#a8c8ff}
.iv-det{padding:12px;border:1px solid var(--au);border-radius:5px;background:linear-gradient(180deg,rgba(46,32,19,.92),rgba(14,9,6,.92));box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 0 3px rgba(18,12,8,.7)}
.iv-dh{display:flex;gap:12px;align-items:center;padding-bottom:8px;border-bottom:1px solid rgba(201,163,90,.3)}
.iv-dn{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:#fff3d6;letter-spacing:.02em;line-height:1.15}
.iv-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}.iv-tag{font-size:11px;letter-spacing:.06em;padding:2px 7px;border-radius:3px;border:1px solid #6a4e28;background:#1e140c;color:#e6d7a8}
.iv-tag.c-cons{border-color:#3e8a58;color:#9cf2b4}.iv-tag.c-wpn{border-color:#8a5a3a;color:#ffc89a}.iv-tag.c-arm{border-color:#4a6a9a;color:#a8c8ff}.iv-tag.c-acc{border-color:#8a6a2a;color:#ffe08a}.iv-tag.c-key{border-color:#8a4a8a;color:#f0b0f0}
.iv-desc{font-family:var(--f-body);font-size:15px;line-height:1.45;color:#eadfc6;margin:2px 0}
.iv-src{font-size:12px;color:#c8b48a;margin:0}
.iv-who small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--au)}
.iv-heads{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.iv-head{display:grid;place-items:center;border:1px solid #4a6a9a;border-radius:3px;background:#0c1426;padding:1px}.iv-head .pzhead{border:0;width:30px!important;height:30px!important}
.iv-head.no{opacity:.28;filter:grayscale(1)}.iv-head.worn{border-color:var(--au-hi);box-shadow:0 0 6px rgba(255,210,120,.45)}
.pzb.iv-act{align-self:flex-start;min-width:160px;font-size:15px;color:#fff3d0;border-color:var(--au)}
.pzb.iv-act.on{box-shadow:0 0 0 2px var(--au-hi)}
.iv-tgts{padding:0;grid-template-columns:1fr}
.iv-tgts .pz-tgt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;border-color:#4a6a9a;background:linear-gradient(90deg,rgba(28,42,74,.9),rgba(14,20,36,.85))}
.iv-tgts .pz-tgt:hover:not([disabled]),.iv-tgts .pz-tgt:focus-visible{border-color:var(--au-hi)}
.iv-tgts .pz-tgt .pzhead{width:32px!important;height:32px!important}
.iv-tt{display:grid;gap:3px;min-width:0}.iv-tr{display:flex;justify-content:space-between;gap:8px}.iv-tr span{color:#9cf2b4;font-weight:700}
.iv-tgts .pz-tgt[disabled] .iv-tr span{color:#a9b3c8}
.iv-empty{display:grid;gap:4px;padding:18px;text-align:center;color:#c8b48a}.iv-empty b{font-family:var(--f-display);font-weight:400;font-size:18px;color:#efe4c8}.iv-empty p{margin:0;font-family:var(--f-body)}
/* ---------- Equipo ---------- */
.pz-slot{grid-template-columns:auto 1fr}
.pz-opt:has(.iv-ic){grid-template-columns:auto 1fr auto;grid-template-areas:"i n c" "i d d"}.pz-opt .iv-ic{grid-area:i}
.pz-st-v.up{color:#9cf2b4;font-weight:700}.pz-st-v.dn{color:#ffb0a8;font-weight:700}
.eq-cur{display:grid;gap:6px}
.eq-ci{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 10px 6px 6px;border:1px solid rgba(201,163,90,.3);border-radius:4px;background:rgba(20,14,9,.7)}
.eq-ci .iv-rt small{letter-spacing:.08em;text-transform:uppercase;font-size:11px}.eq-ci .iv-rt p{margin:2px 0 0;font-family:var(--f-body);font-size:13px;color:#d8cbae;line-height:1.35}
.eq-ci.none{opacity:.6}
/* ---------- Códice (Bestiario · Diario · Afinidad) con la misma línea: marcos dorados y foco claro ---------- */
.pz-body.t-bestiario .cx-bc.on,.pz-body.t-afinidad .on{box-shadow:inset 3px 0 0 var(--au-hi)}
.pz-body [data-nav]:focus-visible{outline:2px solid var(--au-hi);outline-offset:2px}
/* teléfono */
body:not(.wide) .gp-cards{grid-template-columns:1fr}
body:not(.wide) .iv-top{flex-direction:column;align-items:stretch}
body:not(.wide) .iv-filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
body:not(.wide) .pzb.iv-f{flex:0 0 auto}
body:not(.wide) .iv-det{order:-1}
body:not(.wide) .pz-body.t-objetos .iv-top{order:-2}
@media (prefers-reduced-motion:reduce){ .pz-body.pzfade>*,.gp-bar>i.gp-pre{animation:none} .gp-bar>i{transition:none} }
</style>

<body>


<div id="app">
  <header class="topbar">
    <div class="brand">Las Doce Coronas <span>Capítulo 1 · El Contrato</span></div>
    <div class="tools">
      <button class="iconbtn" id="btnPad" type="button" aria-pressed="false" aria-label="Pad en pantalla" title="Mostrar u ocultar el pad en pantalla (palanca y botones A/B)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-1.2 4.1a2.6 2.6 0 0 1-4.4 1.1L14 16h-4l-2.2 2.6a2.6 2.6 0 0 1-4.4-1.1l-1.2-4.1A5 5 0 0 1 7 7z"/><path d="M7.5 10v4M5.5 12h4"/><circle cx="15.6" cy="10.6" r=".9" fill="currentColor" stroke="none"/><circle cx="17.8" cy="12.8" r=".9" fill="currentColor" stroke="none"/></svg><span>Pad</span><span class="led" aria-hidden="true"></span><span class="st" aria-hidden="true"></span></button>
      <button class="iconbtn" id="btnMenu" type="button" aria-haspopup="dialog">Menú</button>
      <button class="iconbtn" id="btnMute" type="button" aria-pressed="false">Sonido: sí</button>
      <button class="iconbtn" id="btnFs" type="button" aria-pressed="false" aria-label="Pantalla completa" title="Pantalla completa (F)"><svg class="fs-on" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="fs-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg><span class="fs-l">Pantalla</span></button>
    </div>
  </header>
  <div id="main">
    <div id="stage">
      <canvas id="cv" width="480" height="300" aria-label="Escenario del juego"></canvas>
      <div id="bubbles" aria-hidden="true"></div>
      <div id="cutin" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <div id="panel">
      <div id="dialog" class="win" hidden aria-live="polite" tabindex="-1"><div id="pframe"><canvas id="pcv" width="192" height="192"></canvas></div><div><div id="dname"></div><div id="dline"></div></div><div id="dnext" aria-hidden="true">▼</div></div>
      <div id="hud" hidden></div>
      <div id="menuBox" hidden><div id="menuTitle" hidden></div><div id="menu" class="win" role="menu"></div><div id="mhelp" class="win" hidden></div></div>
      <div id="pad" hidden role="group" aria-label="Controles en pantalla">
        <div class="pad-zone" id="padZone">
          <div class="pad-stick" id="padStick" role="group" aria-label="Palanca de dirección: arrastrá para caminar en 8 direcciones">
            <div class="pad-glow" aria-hidden="true"></div>
            <button class="padbtn pad-ar" data-k="up" type="button" tabindex="-1" aria-label="Arriba"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 14 11H2z" fill="currentColor"/></svg></button>
            <button class="padbtn pad-ar" data-k="left" type="button" tabindex="-1" aria-label="Izquierda"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 14 11H2z" fill="currentColor"/></svg></button>
            <button class="padbtn pad-ar" data-k="right" type="button" tabindex="-1" aria-label="Derecha"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 14 11H2z" fill="currentColor"/></svg></button>
            <button class="padbtn pad-ar" data-k="down" type="button" tabindex="-1" aria-label="Abajo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 14 11H2z" fill="currentColor"/></svg></button>
            <div class="pad-knob" aria-hidden="true"></div>
          </div>
        </div>
        <div class="pad-btns">
          <button class="padbtn pad-round pad-cfgb" id="padCfg" type="button" aria-label="Ajustes del pad" aria-haspopup="true" aria-expanded="false" aria-controls="padCfgBox"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
          <button class="padbtn pad-round pad-m" id="padMenu" type="button" aria-label="Menú"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg><small class="pk" data-key="menu"></small></button>
          <button class="padbtn pad-round pad-run" id="padRun" type="button" aria-pressed="false" aria-label="Correr (tocá para prender o apagar; también llevando la palanca al borde)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h5M2.5 12h5M4 16h4"/><path d="M11 6l7 6-7 6"/><path d="M15 6l7 6-7 6" opacity=".55"/></svg><small>Correr</small></button>
          <button class="padbtn pad-round pad-b" id="padB" type="button" aria-label="Cancelar (B)"><b>B</b><small class="pk" data-key="cancelar"></small></button>
          <button class="padbtn pad-round pad-a" id="act" type="button" disabled>Acercate a alguien</button>
          <small class="pk pk-a" data-key="confirmar" aria-hidden="true"></small>
          <span class="pad-lbl off" id="padLbl" aria-hidden="true"></span>
        </div>
        <div class="pad-cfg" id="padCfgBox" hidden role="group" aria-label="Ajustes del pad">
          <b>Ajustes del pad</b>
          <label><input type="checkbox" data-opt="float"><span>Palanca flotante<small>aparece donde apoyás el pulgar</small></span></label>
          <label><input type="checkbox" data-opt="vib"><span>Vibración<small>pulso corto al tocar (si el equipo la tiene)</small></span></label>
          <label><input type="checkbox" data-opt="zurdo"><span>Modo zurdo<small>botones a la izquierda, palanca a la derecha</small></span></label>
        </div>
      </div>
    </div>
  </div>
</div>
